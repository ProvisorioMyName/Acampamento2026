<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acamapmento IBJC</title>
    <link rel="shortcut icon" href="img/megumi.jpg" type="jpg" />
    <link rel="stylesheet" href="estilo.css" />
  </head>

  <body>
    <nav>
      <div class="navSubtitulo">
        <img src="img/LogoIBJC.png" alt="" width="45px" />
        <p>acampamento IBJC</p>
      </div>
      <p>2026</p>
    </nav>

    <main>
      <section class="menu-cards">
        <div class="acamp-card">
          <div class="acamp-link">
            <button class="bnt"> Acamp 2026</button>
          </div>

          <div class="imgAcamp">
            <img src="img/LogoAcamp.png" alt="" width="110px" style="z-index: 10;" />
          </div>

          <div class="tituloAcamp">
            <div class="texto-manual">
              <h1>
                <span>Manual do</span> <br />
                acampamento
              </h1>
            </div>
            <div class="data">
              <p>Novembro 2026</p>
            </div>
          </div>
        </div>
        <!-- Estou atualmente mexendo nesse elemento -->
        <div class="check-card">
          <div class="check-link">
            <button class="bnt">Checklist</button>
          </div>
        </div>
        <div class="quarto-card">
          <div class="quarto-link" >
            <button class="bnt">Quartos</button>
          </div>
        </div>
        <div class="culto-card">
          <div class="culto-link">
            <button class="bnt">Cultos</button>
          </div>
        </div>
        <div class="program-card">
          <div class="program-link">
            <button class="bnt">Programação</button>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
